[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftp-transfer"
version = "0.1.0"
description = "LAN file transfer and sync tool based on Paramiko SFTP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
gui = [
    "PyQt5>=5.15",
]

[project.scripts]
sftp-transfer = "sftp_transfer.cli:main"
sftp-transfer-gui = "sftp_transfer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
